aid: podium-education
name: Podium Education
description: >-
  Podium Education is an Austin, Texas experiential-learning and career platform founded in 2018
  that partners with colleges, universities and employers to close the college-to-career gap. Its
  flagship program, The Global Career Accelerator, is a credit-bearing, financial-aid and
  Pell-eligible online field experience in which undergraduates work on real brand projects in data
  analytics, web development, digital marketing and tech operations alongside peers in other
  countries, earning certificates and minors through their own institution. Podium delivers the
  program on its own platform stack — a hosted Canvas LMS estate and a student application at
  globalcareeraccelerator.org — sold to universities as a partnership rather than as software, and
  it publishes no public developer program, API reference or machine-readable contract.
